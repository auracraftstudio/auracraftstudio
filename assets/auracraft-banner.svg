<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">AuraCraft Studio — Create, Animate, Speak, Broadcast</title>
  <desc id="desc">A futuristic deep-space banner with a glowing orbital A symbol and the AuraCraft Studio brand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b24"/><stop offset=".55" stop-color="#10194a"/><stop offset="1" stop-color="#240d49"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#4f46e5" stop-opacity=".55"/><stop offset="1" stop-color="#4f46e5" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1260" cy="90" r="300" fill="url(#glow)"/>
  <circle cx="250" cy="430" r="260" fill="url(#glow)"/>
  <g fill="#dbeafe" opacity=".8">
