  </g>
  <path d="M70 365 C300 160 470 510 720 280 S1180 60 1510 205" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".55"/>
  <path d="M60 405 C310 190 510 540 760 315 S1190 110 1530 245" fill="none" stroke="#22d3ee" stroke-width="1" opacity=".3"/>
  <g transform="translate(125 115)">
