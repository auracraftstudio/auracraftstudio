<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#140826"/>
      <stop offset="100%" stop-color="#03060d"/>
    </linearGradient>
    <linearGradient id="aaccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="aglow"><feGaussianBlur stdDeviation="9" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Canvas Base -->
  <rect width="1500" height="500" fill="url(#abg)"/>

  <!-- Concentric Broadcast Soundwaves in Purple -->
  <g opacity="0.3" stroke="#a855f7" stroke-width="1.5" fill="none">
    <circle cx="190" cy="250" r="160" stroke-dasharray="8 6"/>
    <circle cx="190" cy="250" r="200" stroke-dasharray="12 8"/>
    <circle cx="190" cy="250" r="240" stroke-dasharray="16 10"/>
  </g>

  <!-- Left: 3D Hologram Avatar Core in Purple -->
  <g transform="translate(190, 250)">
    <circle cx="0" cy="0" r="130" fill="#0f071f" stroke="#a855f7" stroke-width="3" filter="url(#aglow)"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="10 6"/>

    <!-- 3D Wireframe Avatar Silhouette -->
    <polygon points="0,-75 28,-35 45,15 0,65 -45,15 -28,-35" fill="#240c42" stroke="#a855f7" stroke-width="2"/>
    <polygon points="0,-75 0,65" stroke="#e879f9" stroke-width="1.5"/>
    <polygon points="-28,-35 28,-35" stroke="#e879f9" stroke-width="1.5"/>
    <polygon points="-45,15 45,15" stroke="#e879f9" stroke-width="1.5"/>

    <!-- Central Sparkle Star -->
    <path d="M 0,-25 Q 0,0 25,0 Q 0,0 0,25 Q 0,0 -25,0 Q 0,0 0,-25 Z" fill="#ffffff" filter="url(#aglow)"/>
    <circle cx="0" cy="0" r="5" fill="#c084fc"/>

    <!-- Broadcast Sound Waves radiating from core -->
    <path d="M 60,-30 A 65,65 0 0,1 60,30" stroke="#e879f9" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 80,-45 A 90,90 0 0,1 80,45" stroke="#a855f7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Right: Virtual Production Studio Elements -->
  <g transform="translate(1080, 160)" opacity="0.8">
    <circle cx="100" cy="80" r="55" fill="#17092e" stroke="#a855f7" stroke-width="2" filter="url(#aglow)"/>
    <polygon points="100,35 125,70 100,75" fill="#7e22ce" opacity="0.6"/>
    <polygon points="145,80 110,105 105,80" fill="#a855f7" opacity="0.6"/>
    <polygon points="100,125 75,90 100,85" fill="#c084fc" opacity="0.6"/>
    <polygon points="55,80 90,55 95,80" fill="#e879f9" opacity="0.6"/>
    <circle cx="100" cy="80" r="18" fill="#080312" stroke="#ffffff" stroke-width="2"/>
    <text x="100" y="85" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#c084fc" text-anchor="middle">3D</text>

    <!-- Sparkles -->
    <polygon points="200,40 205,48 215,50 207,57 209,66 200,61 191,66 193,57 185,50 195,48" fill="#c084fc" filter="url(#aglow)"/>
    <polygon points="30,140 33,146 40,148 35,153 36,160 30,156 24,160 25,153 20,148 27,146" fill="#e879f9"/>
    <polygon points="210,130 213,136 220,138 215,143 216,150 210,146 204,150 205,143 200,138 207,136" fill="#a855f7"/>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(390, 160)">
    <!-- Badge -->
    <rect x="0" y="0" width="290" height="30" rx="15" fill="#200d3d" stroke="#a855f7" stroke-width="1.5"/>
    <circle cx="16" cy="15" r="5" fill="#c084fc"/>
    <text x="32" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff" letter-spacing="2">VIRTUAL BROADCAST LAB</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Segoe UI', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="4">AURACRAFT STUDIO</text>
    
    <!-- Accent Line -->
    <rect x="0" y="105" width="620" height="4" rx="2" fill="url(#aaccent)"/>

    <!-- Tagline -->
    <text x="0" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#cbd5e1" letter-spacing="1">Generative 3D Avatars, Neural Voice &amp; Live Real-Time Studio</text>
    
    <!-- Sub-pills -->
    <g transform="translate(0, 185)" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#180a30" stroke="#a855f7" stroke-width="1"/>
      <text x="70" y="18" fill="#e9d5ff" text-anchor="middle">3D AVATARS</text>
      <rect x="155" y="0" width="150" height="28" rx="6" fill="#180a30" stroke="#a855f7" stroke-width="1"/>
      <text x="230" y="18" fill="#e9d5ff" text-anchor="middle">NEURAL VOICE</text>
      <rect x="320" y="0" width="145" height="28" rx="6" fill="#180a30" stroke="#a855f7" stroke-width="1"/>
      <text x="392" y="18" fill="#e9d5ff" text-anchor="middle">VIDEO GENESIS</text>
      <rect x="480" y="0" width="150" height="28" rx="6" fill="#180a30" stroke="#a855f7" stroke-width="1"/>
      <text x="555" y="18" fill="#e9d5ff" text-anchor="middle">LIVE BROADCAST</text>
    </g>
  </g>
</svg>